<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しずくメトロノーム</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1219; color: #e6eef8;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 260px; padding: 14px; border-radius: 14px;
    background: rgba(18, 26, 38, 0.72); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; gap: 10px; user-select: none; touch-action: pan-y; }
  #panel h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.05em; opacity: 0.85; }
  .row { display: flex; align-items: center; gap: 8px; }
  button { font: inherit; color: inherit; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.16); }
  #play { flex: 1; padding: 10px; font-size: 16px; font-weight: 600; background: #2f7fd8; border-color: #4a98f0; }
  #play.on { background: #a8423d; border-color: #c95a54; }
  .bpm { justify-content: space-between; }
  #bpmVal { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 80px; text-align: center; }
  .bpm small { opacity: 0.6; }
  input[type=range] { width: 100%; accent-color: #4a98f0; }
  label { font-size: 13px; opacity: 0.85; display: flex; flex-direction: column; gap: 4px; }
  label .lab { display: flex; justify-content: space-between; }
  select { font: inherit; color: inherit; background: #1d2838; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 3px 6px; }
  #dots { display: flex; gap: 6px; justify-content: center; min-height: 12px; }
  #dots span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.06s; }
  #dots span.on { background: #7cc4ff; box-shadow: 0 0 8px #7cc4ff; }
  #dots span.accent.on { background: #fff; box-shadow: 0 0 10px #bfe3ff; }
  #status { font-size: 12px; opacity: 0.7; text-align: center; }
  .hint { font-size: 11px; opacity: 0.5; text-align: center; }
  #hide, #toggle { width: 34px; height: 34px; padding: 0; font-size: 16px; line-height: 1; }
  #toggle { position: fixed; top: 12px; left: 12px; display: none; }
  #panel.hidden { display: none; }
  #panel.hidden + #toggle { display: block; }
  #lang { position: fixed; top: 12px; right: 12px; width: 92px; height: 34px; padding: 0; border-radius: 17px;
    display: flex; align-items: center; background: rgba(18, 26, 38, 0.72); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.14); font-size: 13px; font-weight: 600; }
  #lang .opt { position: relative; flex: 1; text-align: center; z-index: 1; opacity: 0.55; transition: opacity 0.2s; }
  #lang .knob { position: absolute; top: 3px; left: 3px; width: 42px; height: 26px; border-radius: 13px;
    background: #2f7fd8; transition: transform 0.2s ease-out; }
  #lang[aria-checked="true"] .knob { transform: translateX(44px); }
  #lang[aria-checked="false"] .opt[data-l="ja"], #lang[aria-checked="true"] .opt[data-l="en"] { opacity: 1; }
  @media (max-width: 600px) { #panel { top: 56px; width: calc(100% - 24px); max-height: calc(100% - 68px); overflow-y: auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div class="row">
    <button id="hide" data-i18n-label="close">✕</button>
    <h1 data-i18n="title">しずくメトロノーム</h1>
  </div>
  <div class="row bpm">
    <button id="minus">−</button>
    <div style="text-align:center"><div id="bpmVal">90</div><small>BPM</small></div>
    <button id="plus">＋</button>
  </div>
  <input type="range" id="bpm" min="30" max="240" value="90">
  <div class="row">
    <button id="play">▶ スタート</button>
    <button id="tap" data-i18n="tap">タップ</button>
  </div>
  <div id="dots"></div>
  <label><span class="lab"><span data-i18n="scene">シーン</span>
    <select id="scene">
      <option value="glass" data-i18n="sceneGlass">グラスと天井</option>
      <option value="frog" data-i18n="sceneFrog">カエルと葉っぱ</option>
    </select></span></label>
  <label><span class="lab"><span data-i18n="beats">拍子</span>
    <select id="beats">
      <option value="1" data-i18n="beatsNone">なし</option>
      <option value="2" data-i18n="beatsN" data-n="2">2拍</option>
      <option value="3" data-i18n="beatsN" data-n="3">3拍</option>
      <option value="4" data-i18n="beatsN" data-n="4" selected>4拍</option>
      <option value="5" data-i18n="beatsN" data-n="5">5拍</option>
      <option value="6" data-i18n="beatsN" data-n="6">6拍</option>
      <option value="7" data-i18n="beatsN" data-n="7">7拍</option>
    </select></span></label>
  <label><span class="lab"><span data-i18n="dropSize">しずくの大きさ</span> <span id="dropVal">5</span></span>
    <input type="range" id="drop" min="1" max="12" value="5"></label>
  <label><span class="lab"><span data-i18n="volume">音量</span> <span id="volVal">70</span></span>
    <input type="range" id="vol" min="0" max="100" value="70"></label>
  <div class="row"><button id="reset" style="flex:1" data-i18n="reset">最初からやり直す</button></div>
  <div id="status"></div>
  <div class="hint" data-i18n="hint">Space: スタート/ストップ　↑↓: BPM　T: タップ</div>
</div>
<button id="toggle" data-i18n-label="open">☰</button>

<!-- 言語切り替え（スライドスイッチ） -->
<button id="lang" role="switch" aria-checked="false" aria-label="Language / 言語">
  <span class="knob"></span><span class="opt" data-l="ja">JP</span><span class="opt" data-l="en">EN</span>
</button>

<script src="sim.js"></script>
<script src="scene-frog.js"></script>
<script src="scene-glass.js"></script>
<script src="app.js"></script>
</body>
</html>
