<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクイーズ 埴輪（three.js 試作）</title>
<style>

  #hud .row { margin: 9px 0; } #hud .lab { display: flex; justify-content: space-between; margin-bottom: 3px; opacity: .85; }
  #hud input[type=range] { width: 100%; accent-color: #e58aa6; }

  #hud button.sel { background: #e58aa6; border-color: #d96d8e; color: #fff; }
  #hint { position: fixed; top: 14px; left: 0; right: 0; text-align: center; font-size: 15px; opacity: .75; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<div id="hint">押してみてください。ぽよんと、ゆっくり戻ります</div>
<div id="hud">
  <div class="row"><div class="lab"><span>戻るはやさ</span><b id="sv">ゆっくり</b></div><input type="range" id="soft" min="0" max="100" value="25"></div>
  <div class="row"><div class="lab"><span>やわらかさ</span><b id="fv">ふつう</b></div><input type="range" id="firm" min="0" max="100" value="45"></div>
  <div class="row" id="shapes"></div>
  <div class="row"><button id="snd">🔊 音 ON</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);

// ============================================================ 形（名前・色・つぶれ方）
const SHAPES = { haniwa: { name: '埴輪', color: 0xe38a60, blush: true } };
let shapeKey = 'haniwa';
// 踊る埴輪のかたち: 丸いカプセルを、なめらかにつなげたもの（中心から見て、外側へ向かう距離を測る）
const sdCap = (p, a, b, r) => { const pax = p.x - a.x, pay = p.y - a.y, paz = p.z - a.z, bax = b.x - a.x, bay = b.y - a.y, baz = b.z - a.z; const h = Math.max(0, Math.min(1, (pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz || 1e-9))); return Math.hypot(pax - bax * h, pay - bay * h, paz - baz * h) - r; };
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const PARTS = [   // [はじ1, はじ2, はんけい]
  [V3(0, -1.0, 0), V3(0, 0.75, 0), 0.58],          // 指サックのような、細長いどう（上がまるい）
  [V3(0.5, 0.1, 0), V3(0.78, 0.4, 0), 0.17],       // 右手: ちょこんと
  [V3(-0.5, 0.1, 0), V3(-0.78, 0.2, 0), 0.17],     // 左手: ちょこんと

const haniwaSDF = (p) => { let d = 1e9; for (const [a, b, r] of PARTS) d = smin(d, sdCap(p, a, b, r), 0.18); return d; };

$('shapes').style.display = 'none';

// ============================================================ three.js の準備
let renderer;

renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
{ const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#fbe8ee'); gr.addColorStop(1, '#f1ddd0'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);

placeCamera();
const sun = new THREE.DirectionalLight(0xfff2e6, 2.2); sun.position.set(-2.5, 5, 3.5); sun.castShadow = false; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 14 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02; scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffeef2, 0xe9d4c8, 0.6));

// ============================================================ やわらかい体（頂点ごとに動く、位置ベースの簡易ソフトボディ）

const floorY = 0.0;
function buildBody(key) {

  const base = new THREE.IcosahedronGeometry(1, 5).toNonIndexed(), pa = base.attributes.position, map = new Map(), pos = [], idx = [];

  }

  for (let i = 0; i < N; i++) { const v = sh.make(new THREE.Vector3(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2])); rv.push(v); minY = Math.min(minY, v.y); }
  for (let i = 0; i < N; i++) { R[i * 3] = rv[i].x; R[i * 3 + 1] = rv[i].y; R[i * 3 + 2] = rv[i].z; }

  for (let f = 0; f < faces.length; f += 3) for (let k = 0; k < 3; k++) { const a = faces[f + k], b = faces[f + (k + 1) % 3], key2 = a < b ? a * 1e6 + b : b * 1e6 + a; if (!eset.has(key2)) { eset.add(key2); el.push(a, b); neighbors[a].push(b); neighbors[b].push(a); } }

  for (let e = 0; e < restLen.length; e++) { const a = edges[e * 2], b = edges[e * 2 + 1]; restLen[e] = Math.hypot(R[a * 3] - R[b * 3], R[a * 3 + 1] - R[b * 3 + 1], R[a * 3 + 2] - R[b * 3 + 2]); }
  geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(X, 3)); geo.setIndex(new THREE.BufferAttribute(faces, 1)); geo.computeVertexNormals(); normals = geo.attributes.normal.array;

}

// 顔: 近くの頂点にくっつけて、体といっしょに動かす
function nearest(dir) { let best = 0, bd = -2; for (let i = 0; i < N; i++) { const x = R[i * 3] - HEAD_C.x, y = R[i * 3 + 1] - HEAD_C.y, z = R[i * 3 + 2] - HEAD_C.z, l = Math.hypot(x, y, z) || 1, d = (x * dir.x + y * dir.y + z * dir.z) / l; if (d > bd) { bd = d; best = i; } } return best; }

  const mk = (geom, mat, dir, push, scale) => { const i = nearest(dir.clone().normalize()), o = new THREE.Mesh(geom, mat); if (scale) o.scale.copy(scale); scene.add(o); faceParts.push({ obj: o, i, push }); };

  mk(new THREE.SphereGeometry(0.09, 20, 14), black, new THREE.Vector3(-0.38, 0.2, 1), 0.01, new THREE.Vector3(1, 1, 0.5));   // 埴輪の、まるい目
  mk(new THREE.SphereGeometry(0.09, 20, 14), black, new THREE.Vector3(0.38, 0.2, 1), 0.01, new THREE.Vector3(1, 1, 0.5));
  mk(new THREE.SphereGeometry(0.075, 20, 14), black, new THREE.Vector3(0, -0.32, 1), 0.01, new THREE.Vector3(1, 1, 0.5));        // まるい口
  if (sh.blush) { const pink = new THREE.MeshStandardMaterial({ color: 0xff9bb0, roughness: 0.8, transparent: true, opacity: 0.6 }); mk(new THREE.SphereGeometry(0.1, 16, 12), pink, new THREE.Vector3(-0.8, -0.1, 0.75), 0.0, new THREE.Vector3(1.2, 0.7, 0.3)); mk(new THREE.SphereGeometry(0.1, 16, 12), pink, new THREE.Vector3(0.8, -0.1, 0.75), 0.0, new THREE.Vector3(1.2, 0.7, 0.3)); }
}

// ============================================================ 指（押す丸い先）
const finger = { on: false, c: new THREE.Vector3(), r: 0.42, depth: 0, hold: 0, anchor: new THREE.Vector3(), d0: 3, sx: 0, sy: 0, vis: null };

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', (e) => { ensureAudio(); setNdc(e); const r = renderer.domElement.getBoundingClientRect(); if (press(ndc.x, ndc.y)) { renderer.domElement.setPointerCapture(e.pointerId); sndPress(); } });

$('soft').oninput = settings; $('firm').oninput = settings; settings();
let defNow = 0, lastDef = 0;

// ============================================================ 音（へこむと低く、離すとぽよんと戻る）

// ============================================================ 起動

if (Q.get('manual') === '1') {

    const nx = parseFloat(Q.get('nx') || '0'), ny = parseFloat(Q.get('ny') || '0.1'), hold = parseFloat(Q.get('hold') || '0'), after = parseFloat(Q.get('after') || '0');

    let pr = false; if (hold > 0) { pr = press(nx, ny); document.documentElement.setAttribute('data-press', String(pr) + ' d0=' + finger.d0.toFixed(2)); if (pr) { for (let i = 0; i < hold * 60; i++) step(1 / 60); } }
    if (after > 0) { finger.on = false; for (let i = 0; i < after * 60; i++) step(1 / 60); }
    step(0.0001); renderer.render(scene, camera);
    const img = new Image(); img.src = renderer.domElement.toDataURL('image/png'); img.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%'; document.body.appendChild(img);
    let mx = 0, my = 0, bad = 0; for (let i = 0; i < N; i++) { mx = Math.max(mx, Math.hypot(X[i * 3], X[i * 3 + 2])); my = Math.max(my, X[i * 3 + 1]); if (!isFinite(X[i * 3])) bad++; }
    let md = 0, near = 0; for (let i = 0; i < N; i++) { md = Math.max(md, Math.hypot(X[i * 3] - R[i * 3], X[i * 3 + 1] - R[i * 3 + 1], X[i * 3 + 2] - R[i * 3 + 2])); if (Math.hypot(X[i * 3] - finger.c.x, X[i * 3 + 1] - finger.c.y, X[i * 3 + 2] - finger.c.z) < finger.r * 1.05) near++; }
    document.documentElement.setAttribute('data-dbg', `on=${finger.on} depth=${finger.depth.toFixed(2)} c=${finger.c.x.toFixed(2)},${finger.c.y.toFixed(2)},${finger.c.z.toFixed(2)} maxDisp=${md.toFixed(2)} near=${near}`);
    document.documentElement.setAttribute('data-def', `def=${defNow.toFixed(4)} maxR=${mx.toFixed(2)} maxY=${my.toFixed(2)} bad=${bad} vol=${(volume() / V0).toFixed(3)}`);
  }, 600);
} else requestAnimationFrame(frame);
</script>
</body>
