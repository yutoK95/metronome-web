<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Timer / 水がたまるタイマー</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Yu Gothic UI", Meiryo, sans-serif; }
  body.ui { background: radial-gradient(ellipse at 50% 40%, #2a3b52, #0c121a); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 10px; align-items: center; justify-content: center;
    padding: 10px 12px; border-radius: 14px; background: rgba(15, 22, 32, 0.8); }
  body.run #bar { display: flex; }
  button { font: inherit; color: #dbe6f3; background: #223249; border: 1px solid #3a4b63; border-radius: 8px; cursor: pointer;
    height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  button:hover { background: #2d4260; }
  #bar button { width: 128px; padding: 0; font-size: 15px; }
  #setup { position: fixed; left: 28px; top: 50%; transform: translateY(-50%); width: 320px; padding: 20px; border-radius: 16px; display: none;
    background: rgba(15, 22, 32, 0.88); color: #dbe6f3; font-size: 14px; max-height: calc(100% - 24px); overflow-y: auto; box-sizing: border-box; }
  body.setup #setup { display: block; }
  #setup h2 { margin: 0 0 6px; font-size: 17px; }
  #setup .lab { margin: 14px 0 6px; font-size: 13px; color: #8fa3bb; }
  #setup .row { display: grid; gap: 8px; }
  #setup .five { grid-template-columns: repeat(5, 1fr); }
  #setup .shapes { grid-template-columns: repeat(2, 1fr); }
  #setup button { width: 100%; padding: 0 6px; font-size: 13px; }
  #setup button.sel { background: #2f7fd8; border-color: #4a98f0; color: #fff; }
  #setup .custom { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #setup input { width: 80px; height: 40px; box-sizing: border-box; font: inherit; color: #dbe6f3; background: #1a2638; border: 1px solid #3a4b63; border-radius: 8px; padding: 0 10px; }
  #start { position: sticky; bottom: 0; margin-top: 18px; box-shadow: 0 -10px 12px rgba(15, 22, 32, 0.9); height: 48px !important; font-size: 17px !important; font-weight: 700; background: #2f9f6a !important; border-color: #4cc38a !important; color: #fff !important; }
  #menuBtn { position: fixed; left: 14px; top: 14px; width: 44px; height: 44px; padding: 0; font-size: 20px; display: none; background: rgba(15, 22, 32, 0.8); }
  body.run #menuBtn { display: inline-flex; }
  #menu { position: fixed; left: 14px; top: 66px; width: 270px; padding: 16px; border-radius: 14px; display: none; box-sizing: border-box;
    background: rgba(15, 22, 32, 0.9); color: #dbe6f3; font-size: 14px; }
  body.run.menu #menu { display: block; }
  #menu #reset { width: 100%; height: 44px; font-size: 15px; font-weight: 700; color: #fff; background: #c0392b; border-color: #e0584a; }
  #menu #reset:hover { background: #d84a3a; }
  #menu .item { margin-bottom: 14px; }
  #menu .item:last-child { margin-bottom: 0; }
  #menu .head { display: flex; justify-content: space-between; margin-bottom: 6px; color: #8fa3bb; font-size: 13px; }
  #menu .head b { color: #fff; font-variant-numeric: tabular-nums; }
  #menu input[type=range] { width: 100%; accent-color: #4a98f0; }
  @media (max-width: 640px) { #setup { left: 50%; top: auto; bottom: 12px; transform: translateX(-50%); width: calc(100% - 24px); max-height: 56vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="setup">
  <h2>Water Timer</h2>
  <div class="lab">時間 / Minutes</div>
  <div class="row five" id="mins"></div>
  <div class="custom"><input id="min" type="number" min="1" max="600" step="1" value="25"><span>分 / min</span></div>
  <div class="lab">テンポ / BPM（水滴が落ちる速さ・音）</div>
  <div class="row five" id="bpms"></div>
  <div class="custom"><input id="bpm" type="number" min="0" max="240" step="1" value="60"><span>BPM（0 = Off）</span></div>
  <div class="lab">見た目 / Style</div>
  <div class="row shapes" id="shapes"></div>
  <button id="start">▶ Start</button>
</div>
<button id="menuBtn" aria-label="Menu">☰</button>
<div id="menu">
  <div class="item"><div class="head"><span>テンポ / BPM</span><b id="bpmVal">60</b></div><input type="range" id="bpmSl" min="0" max="240" step="1" value="60"></div>
  <div class="item"><div class="head"><span>音量 / Volume</span><b id="volVal">70</b></div><input type="range" id="volSl" min="0" max="100" step="1" value="70"></div>
  <div class="item"><button id="reset">↻ Reset</button></div>
</div>
<div id="bar">
  <button id="go">❚❚ Pause</button>
  <button id="snd">🔊 Sound ON</button>
</div>
<script>
(() => {
  'use strict';
  // ------------------------------------------------------------------
  // 水がたまるタイマー（OBS のブラウザソース用）。設定は URL の ? 以降でも渡せる:
  //   min=25 / sec=30 / bpm=60 (0 = なし) / shape=wine / color=4aa8ff / label=文字
  //   text=0 (時間の表示を消す) / sound=0 (音を消す) / ui=0 (操作バーと背景を消す = OBS用)
  //   start=1 (設定画面を飛ばして始める)
  // 時間が 0 になっても止まらず、-00:01, -00:02 …と進み、グラスからあふれた水が水槽にたまり、
  // やがて浮力でグラスが浮いて倒れる。
  // ------------------------------------------------------------------
    
  const circ = (c, r) => (t) => { const d = (t - c) / r; return d * d >= 1 ? 0.004 : Math.max(0.004, r * Math.sqrt(1 - d * d)); };  
  // 形の定義: hw(t) = 高さ t (0=底, 1=上端) での半分の幅 / from: 水がたまり始める高さ  
  // handle: 取っ手 / cork: 栓 / foot: 脚つき・台つき（物理では広い底になる） / tint: 液体の色  
  const SHAPES = {  
    tumbler:  { name: 'Tumbler / タンブラー', hw: (t) => 0.24 + 0.05 * t, tint: [74, 168, 255], objs: [['ice', 3]], pitch: 1.0, kick: 2.72 },  
    wine:     { name: 'Wine glass / ワイングラス', from: 0.42, hw: (t) => t < 0.42 ? 0.012 : 0.3 * Math.sqrt(Math.max(0, 1 - Math.pow(1 - (t - 0.42) / 0.34, 2))) * (t > 0.76 ? 1 - 0.1 * Math.pow((t - 0.76) / 0.24, 2) : 1) + 0.012, foot: true, tint: [150, 30, 60], pitch: 0.82, kick: 2.56 },  
    martini:  { name: 'Martini / カクテル', from: 0.42, hw: (t) => t < 0.42 ? 0.012 : 0.012 + 0.34 * (t - 0.42) / 0.58, foot: true, tint: [190, 230, 120], objs: [['olive', 1]], pitch: 1.12, kick: 2.56 },  
    beaker:   { name: 'Beaker / ビーカー', hw: () => 0.2, ticks: true, tint: [90, 220, 190], pitch: 1.05, kick: 2.24 },  
    flask:    { name: 'Flask / フラスコ', hw: (t) => t < 0.55 ? 0.3 - (0.3 - 0.075) * Math.pow(t / 0.55, 1.6) : 0.075, tint: [255, 150, 60], ticks: true, pitch: 1.2, kick: 3.20 },  
    potion:   { name: 'Potion / ポーション', hw: (t) => t < 0.46 ? circ(0.28, 0.28)(t) : 0.085 + (circ(0.28, 0.28)(0.46) - 0.085) * Math.exp(-(t - 0.46) / 0.05), cork: true, tint: [170, 80, 240], pitch: 1.3, kick: 1.44 },  
    teacup:   { name: 'Teacup / ティーカップ', hw: (t) => 0.36 * Math.pow(Math.sin(Math.min(1, (t + 0.06) / 1.06) * Math.PI / 2), 0.55), handle: true, tint: [200, 120, 50], pitch: 0.92, kick: 1.28 },  
    mug:      { name: 'Mug / マグカップ', hw: () => 0.26, handle: true, tint: [90, 55, 30], pitch: 0.78, kick: 2.88 },  
    fishbowl: { name: 'Fishbowl / 金魚鉢', hw: (t) => t > 0.86 ? 0.2 : (circ(0.45, 0.45)(t) > 0.2 || t < 0.5 ? circ(0.45, 0.45)(t) : Math.max(0.2, circ(0.45, 0.45)(t))), tint: [90, 190, 255], objs: [['egg', 5]], pitch: 0.95, kick: 1.92 },  
    tube:     { name: 'Test tube / 試験管', hw: (t) => t < 0.1 ? circ(0.1, 0.1)(t) * 0.8 : 0.08, tint: [120, 255, 140], ticks: true, foot: true, pitch: 1.45, kick: 2.40 },  
    vase:     { name: 'Vase / 花瓶', hw: (t) => t < 0.75 ? 0.08 + 0.2 * Math.sin(Math.PI * t / 0.75) : 0.08 + 0.02 * (t - 0.75) / 0.25, tint: [110, 200, 230], flower: true, pitch: 1.0, kick: 1.28 },  
    shishi:   { name: 'Shishi-odoshi / 鹿威し', mode: 'shishi', hidden: true, tint: [90, 185, 255], pitch: 1.0 },  
    beko:     { name: 'Akabeko / 赤べこ', mode: 'beko', hidden: true, tint: [90, 185, 255], pitch: 1.0 },  
  };  
    
  // ---- 多角形の計算 ----  
  function polyArea(p) {   // 面積と重心（頂点は閉じた順番）  
    let a = 0, cx = 0, cy = 0;  
    for (let i = 0, n = p.length; i < n; i++) {  
      const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % n], c = x0 * y1 - x1 * y0;  
      a += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;  
    }  
    if (Math.abs(a) < 1e-12) return { area: 0, cx: 0, cy: 0 };  
    return { area: Math.abs(a) / 2, cx: cx / (3 * a), cy: cy / (3 * a) };  
  }  
  function clipBelow(p, h) {   // y <= h の部分だけ残す  
    const out = [];  
    for (let i = 0, n = p.length; i < n; i++) {  
      const A = p[i], B = p[(i + 1) % n], ia = A[1] <= h, ib = B[1] <= h;  
      if (ia) out.push(A);  
      if (ia !== ib) { const t = (h - A[1]) / (B[1] - A[1]); out.push([A[0] + (B[0] - A[0]) * t, h]); }  
    }  
    return out;  
  }  
  function chordAt(p, h) {   // 高さ h の水平線が多角形と交わる左右の x（水面の幅）  
    let lo = Infinity, hi = -Infinity;  
    for (let i = 0, n = p.length; i < n; i++) {  
      const A = p[i], B = p[(i + 1) % n];  
      if ((A[1] - h) * (B[1] - h) <= 0 && A[1] !== B[1]) { const x = A[0] + (B[0] - A[0]) * (h - A[1]) / (B[1] - A[1]); lo = Math.min(lo, x); hi = Math.max(hi, x); }  
    }  
    return lo <= hi ? [lo, hi] : null;  
  }  
  const areaBelow = (p, h) => { const c = clipBelow(p, h); return c.length < 3 ? { area: 0, cx: 0, cy: 0 } : polyArea(c); };  
    
  // 水以外のオブジェクト: r 半径 / rho 水に対する重さ（1 より小さいと浮く）/ e 反発  
  const OBJ = { ice: { r: 0.05, rho: 0.88, e: 0.3 }, olive: { r: 0.04, rho: 1.1, e: 0.15 }, pebble: { r: 0.03, rho: 2.4, e: 0.25 }, egg: { r: 0.032, rho: 1.04, e: 0.1 }, fish: { r: 0.045, rho: 1.0, e: 0.2 } };  
  const HATCH_FRAC = 0.4;   // 金魚鉢の水がこの割合までたまったら、卵が孵化する  
  function pointInPoly(p, x, y) {  
    let c = false;  
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {  
      if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) c = !c;  
    }  
    return c;  
  }  
  const G = 3.2;          // 重力（容器の高さ / 秒^2）  
  const BUOY = 1.4;       // 浮力のつよさ（演出用に水より少し重い液体として計算）  
  const KN = 5200, CN = 40, KT = 90, MU = 0.7;   // 床との接触（ばね・減衰・摩擦）。重さに比例させて軽い形でも安定させる  
    
  function makeBody(shape, tankW, tankH) {  
    const hw = shape.hw, from = shape.from || 0;  
    const baseHalf = shape.foot ? 0.2 : Math.max(0.08, Math.min(hw(0.03), 0.3));   // 置いたときの底の幅  
    const hwP = (t) => t < 0.012 ? Math.max(hw(t), baseHalf) : hw(t);  
    const S = 48, sil = [], inner = [];  
    for (let k = 0; k <= S; k++) { const t = k / S; sil.push([-hwP(t), t]); }  
    for (let k = S; k >= 0; k--) { const t = k / S; sil.push([hwP(t), t]); }  
    for (let k = 0; k <= S; k++) { const t = from + (1 - from) * k / S; inner.push([-hw(t), t]); }  
    for (let k = S; k >= 0; k--) { const t = from + (1 - from) * k / S; inner.push([hw(t), t]); }  
    const silInfo = polyArea(sil);  
    // 内側の水の量（面積）を高さ t から求める表  
    const NT = 240, cum = new Float64Array(NT + 1);  
    for (let i = 1; i <= NT; i++) { const t0 = from + (1 - from) * (i - 1) / NT, t1 = from + (1 - from) * i / NT; cum[i] = cum[i - 1] + (hw(t0) + hw(t1)) * (t1 - t0); }  
    const capacity = cum[NT];  
    const areaAt = (t) => { const u = Math.max(0, Math.min(1, (t - from) / (1 - from))) * NT, i = Math.min(NT - 1, Math.floor(u)); return cum[i] + (cum[i + 1] - cum[i]) * (u - i); };  
    const mShell = 0.03 * silInfo.area + 0.02;  
    const cShell = silInfo.cy * 0.5;  
    
    const b = {  
      shape, sil, inner, capacity, areaAt, baseHalf, silArea: silInfo.area, mShell,  
      tankW, tankH,  
      X: 0, Y: 0, th: 0, vx: 0, vy: 0, w: 0, clock: 0,  
      V: 0, Vp: 0, level: 0, spill: 0, spillTotal: 0, poolD: 0, sub: 0, chord: null, Cx: 0, Cy: 0, objects: [], events: [], wallW: 0,  
      T(u, w) { const c = Math.cos(b.th), s = Math.sin(b.th); return [b.X + u * c - w * s, b.Y + u * s + w * c]; },  
      // クリックの衝撃: dir = +1 で反時計回り。水面がふちに近いほど、水がはねてこぼれる。こぼれた量を返す  
      kick(dir, scale = 1) {  
        b.w += dir * (shape.kick || 2) * scale;  
        let vol = 0;  
        if (b.V > 1e-4 && b.chord) {  
          const free = Math.max(0, 1 - b.level + b.Y), hs = 0.07 * scale * (shape.kick || 2) / 2.5, width = b.chord[1] - b.chord[0];  
          if (hs > free) vol = Math.min(b.V * 0.4, (hs - free) * width * 0.6);  
          b.V -= vol; b.Vp += vol; b.spillTotal += vol;  
        }  
        return vol;  
      },  
      // 落ちてきた水を加える: グラスの中へ（あふれた分は床へ）、または直接床へ  
      addWater(v, toGlass) { if (toGlass) b.V += v; else b.Vp += v; },  
      // 水以外のオブジェクトを、空のグラスの底に置く  
      initObjects() {  
        b.objects = []; let k = 0;  
        for (const [kind, n] of (shape.objs || [])) {  
          for (let i = 0; i < n; i++, k++) {  
            const d = OBJ[kind];  
            b.objects.push({ kind, r: d.r, rho: d.rho, e: d.e, x: (i - (n - 1) / 2) * d.r * 2.2, y: from + d.r * 1.2 + k * d.r * 2.4, vx: 0, vy: 0, th: i * 0.7, w: 0, last: 0, wet: 0, delay: 0.5 + i * 0.7, hd: 0, tt: 0, dir: 1, id: k });  
          }  
        }  
      },  
      reset() { b.X = b.Y = b.th = b.vx = b.vy = b.w = 0; b.V = b.Vp = b.level = b.spill = b.poolD = b.sub = b.clock = 0; b.events = []; b.initObjects(); },  
      // 水位から水の量（直立しているとき）  
      volumeAtLevel: areaAt,  
      // 1 ステップ進める。inflow: 容器に加わる水（面積 / 秒）  
      step(dt, inflow) {  
        const n = Math.max(1, Math.ceil(dt / (1 / 150))), h = dt / n;  
        let spilled = 0;  
        for (let i = 0; i < n; i++) spilled += b.sub1(h, inflow);  
        b.spillTotal += spilled;  
        b.spill += (spilled / dt - b.spill) * Math.min(1, dt * 8);  
      },  
      // --- 水以外のオブジェクト（氷・オリーブ・小石）: 水の浮力、グラスの壁、床、ほかのオブジェクトとの当たり判定 ---  
      stepObjects(dt, Iw) {  
        const objs = b.objects, now = (b.clock || 0), walls = [];  
        // グラスの内側の壁（上の口は開いているので、上辺は含めない）  
        const n = inner.length, S = (n - 2) / 2;  
        for (let i = 0; i < n; i++) { if (i === S) continue; const A = Iw[i], B = Iw[(i + 1) % n]; walls.push([A, B]); }  
        const hit = (o, speed, other) => { if (speed > 0.12 && now - o.last > 0.07) { o.last = now; b.events.push({ kind: o.kind, other, speed }); } };  
        for (const o of objs) {  
          // 水の中にいるか（グラスの中の水面か、床にたまった水面か）  
          let level = -1e9;  
          if (b.V > 1e-6 && pointInPoly(Iw, o.x, o.y)) level = b.level;  
          if (b.poolD > 0) level = Math.max(level, b.poolD);  
          const f = Math.max(0, Math.min(1, (level - (o.y - o.r)) / (2 * o.r)));  
          // 卵: 水に浸かって、グラスの水が一定量たまる（または床の水に浸かる）と、少しずつ時間をずらして孵化する  
          if (o.kind === 'egg') {  
            if (f > 0.99 && (b.poolD > 0.05 || b.V >= HATCH_FRAC * b.capacity)) o.wet += dt; else o.wet = Math.max(0, o.wet - dt);  
            if (o.wet > o.delay) { const d = OBJ.fish; o.kind = 'fish'; o.r = d.r; o.rho = d.rho; o.e = d.e; o.vy += 0.3; b.events.push({ kind: 'hatch', x: o.x, y: o.y, speed: 0, other: '' }); }  
          }  
          // 魚: 水の中をゆっくり泳ぐ（ときどき向きを変える）。水面には出ない  
          if (o.kind === 'fish' && f > 0.8) {  
            o.tt -= dt;  
            if (o.tt <= 0) { o.hd = (Math.random() - 0.5) * 1.6 + (Math.random() < 0.5 ? 0 : Math.PI); o.tt = 0.8 + Math.random() * 1.6; }  
            const th = 0.9; o.vx += Math.cos(o.hd) * th * dt; o.vy += Math.sin(o.hd) * th * 0.45 * dt;  
            if (o.y + o.r > level - 0.05) o.vy -= 1.2 * dt;  
            if (Math.abs(o.vx) > 0.03) o.dir += ((o.vx > 0 ? 1 : -1) - o.dir) * Math.min(1, dt * 6);  
          }  
          const ay = -G + G * f / o.rho, drag = 0.02 + 3.2 * f;  
          o.vx += (-drag * o.vx) * dt; o.vy += (ay - drag * o.vy) * dt; o.w += -(0.1 + 2 * f) * o.w * dt;  
          o.x += o.vx * dt; o.y += o.vy * dt; o.th += o.w * dt;  
          // 床と部屋の壁  
          if (o.y < o.r) { o.y = o.r; if (o.vy < 0) { hit(o, -o.vy, 'floor'); o.vy = -o.vy * o.e; o.vx *= 0.92; } }  
          if (o.kind === 'fish') o.th += (0 - o.th) * Math.min(1, dt * 5), o.w = 0;   // 魚は体を水平に保つ  
          const lim = (b.wallW || 3) / 2 - o.r;  
          if (o.x < -lim) { o.x = -lim; o.vx = Math.abs(o.vx) * o.e; } else if (o.x > lim) { o.x = lim; o.vx = -Math.abs(o.vx) * o.e; }  
          // グラスの壁（動いている壁の速さも考える）  
          for (const [A, B] of walls) {  
            const ex = B[0] - A[0], ey = B[1] - A[1], L2 = ex * ex + ey * ey || 1e-9;  
            const u = Math.max(0, Math.min(1, ((o.x - A[0]) * ex + (o.y - A[1]) * ey) / L2)), cx = A[0] + ex * u, cy = A[1] + ey * u;  
            let dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);  
            if (d >= o.r + 0.004) continue;  
            if (d < 1e-6) { dx = 0; dy = 1; d = 1; }  
            const nx = dx / d, ny = dy / d;  
            o.x = cx + nx * (o.r + 0.004); o.y = cy + ny * (o.r + 0.004);  
            const wx = b.vx - b.w * (cy - b.Cy), wy = b.vy + b.w * (cx - b.Cx);  
            const rel = (o.vx - wx) * nx + (o.vy - wy) * ny;

  // 赤べこは、頭をクリックしてもうなずく

  function draw() {
    if (shape.mode) { drawSpecial(); return; }

    const L = layout(), hc = L.hc, hw = shape.hw, c = liquidRGB(), from = shape.from || 0;

    const local = (fn) => { ctx.save(); ctx.translate(ox, oy); ctx.rotate(-body.th); fn(); ctx.restore(); };
    const outline = (t0, t1, close) => {

    local(() => {
      if (shape.ticks) { ctx.strokeStyle = 'rgba(235,245,255,0.6)'; ctx.lineWidth = 1.5 * dpr; for (let k = 1; k <= 9; k++) { const t = k / 10; ctx.beginPath(); ctx.moveTo(hw(t) * hc, -t * hc); ctx.lineTo(hw(t) * hc - (k % 5 ? 10 : 18) * dpr, -t * hc); ctx.stroke(); } }

  // ---- 操作 ----
  const setGoLabel = () => { $('go').textContent = running ? '❚❚ Pause' : '▶ Resume'; };
  const setSndLabel = () => { $('snd').textContent = soundOn ? '🔊 Sound ON' : '🔇 Sound OFF'; };
  function toggleRun() { if (setupMode) return; running = !running; setGoLabel(); }
  function toggleSound() { soundOn = !soundOn; if (soundOn) ensureAudio(); setSndLabel(); }
  function clearRun() { elapsed = 0; chimed = false; drop = null; parts = []; nextLand = 0; ripples = []; body = newBody(); sp = null; }
  // リセット: 設定画面に戻る（直前の時間・テンポ・見た目が選ばれたまま）
  function toSetup() {
    if (setupMode) return;
    running = false; setupMode = true; clearRun(); document.body.classList.remove('menu'); syncClasses(); refreshSetup();
  }
  function startTimer() {
    const m = parseFloat($('min').value);
    if (!(m > 0)) { $('min').focus(); return; }
    totalSec = Math.min(600, m) * 60; bpm = Math.max(0, Math.min(240, parseFloat($('bpm').value) || 0));
    clearRun(); setupMode = false; running = true; syncClasses(); setGoLabel(); setSndLabel();
    if (soundOn) ensureAudio();
  }
  // ハンバーガーメニュー: 作動中にテンポと音量をスライダーで変える
  const syncMenu = () => { $('bpmSl').value = bpm; $('bpmVal').textContent = bpm > 0 ? bpm : 'Off'; $('volSl').value = Math.round(volume * 100); $('volVal').textContent = Math.round(volume * 100); };
  $('menuBtn').onclick = () => { document.body.classList.toggle('menu'); syncMenu(); };
  $('bpmSl').oninput = () => { bpm = +$('bpmSl').value; nextLand = 0; syncMenu(); };   // 次のしずくから新しいテンポで落とす
  $('volSl').oninput = () => { volume = +$('volSl').value / 100; syncMenu(); };
  $('go').onclick = toggleRun; $('reset').onclick = toSetup; $('snd').onclick = toggleSound; $('start').onclick = startTimer;
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') { if (e.code === 'Enter' && setupMode) startTimer(); return; }
    if (e.code === 'Space') { e.preventDefault(); if (setupMode) startTimer(); else toggleRun(); }
    else if (e.code === 'Enter' && setupMode) startTimer();
    else if (e.code === 'KeyM') toggleSound();
  });

  // 設定画面（時間・テンポ・見た目）
  const markGroup = (box, pred) => { for (const b of box.children) b.classList.toggle('sel', pred(b)); };
  const markMin = () => markGroup($('mins'), (b) => +b.dataset.m === parseFloat($('min').value));
  const markBpm = () => markGroup($('bpms'), (b) => +b.dataset.b === (parseFloat($('bpm').value) || 0));
  const markShape = () => markGroup($('shapes'), (b) => b.dataset.k === curKey);
  function refreshSetup() { $('min').value = Math.round(totalSec / 60 * 100) / 100; $('bpm').value = bpm; markMin(); markBpm(); markShape(); }
  for (const m of [5, 10, 25, 45, 60]) { const b = document.createElement('button'); b.textContent = m; b.dataset.m = m; b.onclick = () => { $('min').value = m; markMin(); }; $('mins').appendChild(b); }
  for (const bp of [0, 60, 80, 100, 120]) { const b = document.createElement('button'); b.textContent = bp ? bp : 'Off'; b.dataset.b = bp; b.onclick = () => { $('bpm').value = bp; markBpm(); }; $('bpms').appendChild(b); }
  for (const [k, sh] of Object.entries(SHAPES)) { if (!usable(k)) continue; const b = document.createElement('button'); b.textContent = sh.name; b.dataset.k = k; b.onclick = () => { curKey = k; shape = sh; body = newBody(); sp = null; markShape(); }; $('shapes').appendChild(b); }
  $('min').oninput = markMin; $('bpm').oninput = markBpm;
  refreshSetup(); setSndLabel(); syncMenu();

  // 確認用: ?at=600 で 600 秒経過した状態にして、settle=秒 だけ物理を進める
  if (Q.has('at')) { elapsed = parseFloat(Q.get('at')) || 0; if (body) body.V = body.areaAt(levelT(Math.min(1, elapsed / totalSec))); }
  if (!setupMode) running = true;
  setGoLabel();
  if (Q.has('settle')) { const sec = Math.max(1, parseFloat(Q.get('settle')) || 1); for (let i = 0; i < sec * 60; i++) update(1 / 60); }

  // 画面が見えているあいだは描画つきで更新する
  function frame(now) { const dt = Math.min(0.25, (now - lastT) / 1000); lastT = now; update(dt); draw(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  // 別のタブや画面に隠れているあいだは、ブラウザが描画（rAF）を止めてしまうので、
  // Web Worker の定期タイマーで更新だけを進める（時間・水滴・音が止まらない）
  try {
    const wk = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},50)'], { type: 'text/javascript' })));
    wk.onmessage = () => {
      if (!document.hidden) return;
      const now = performance.now(), dt = Math.min(0.5, (now - lastT) / 1000); lastT = now; update(dt);
    };
  } catch (e) { /* Worker が使えない環境では、見えているときだけ動く */ }
})();
</script>
</body>
</html>
