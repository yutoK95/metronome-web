<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展開予想ボード（競馬・ボート）</title>
<style>
  :root { --ink: #22303c; --paper: #f7f9fb; --line: #c9d3dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e9eef2; color: var(--ink); font-family: system-ui, "Yu Gothic UI", Meiryo, sans-serif; }
  body { display: flex; flex-direction: column; }
  #panel { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); font-size: 14px; user-select: none; }
  #panel label { display: inline-flex; align-items: center; gap: 6px; }
  #panel button, #panel select { font: inherit; color: var(--ink); background: #f1f5f8; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #panel button:hover { background: #e4ecf2; }
  #nums { display: flex; flex-wrap: wrap; gap: 4px; max-width: 560px; }
  #nums button { width: 30px; padding: 4px 0; text-align: center; }
  #nums button.sel { background: #22303c; color: #fff; border-color: #22303c; }
  #stage { flex: 1; min-height: 0; padding: 14px; display: flex; }
  #board { position: relative; flex: 1; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
  body.clear #board { background: transparent; border-color: transparent; }
  .lane { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .lane:first-of-type { border-top: 0; }
  .lane span { position: absolute; left: 12px; top: 8px; font-size: 14px; font-weight: 700; color: #7b8c9a; letter-spacing: .1em; }
  body.clear .lane, body.clear .arrow { display: none; }
  .arrow { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: #7b8c9a; }
  .chip { position: absolute; width: var(--sz, 54px); height: var(--sz, 54px); margin: calc(var(--sz, 54px) / -2) 0 0 calc(var(--sz, 54px) / -2); display: grid; place-items: center; font-weight: 800; font-size: calc(var(--sz, 54px) * 0.5); cursor: grab; box-shadow: 0 2px 6px rgba(0,0,0,.28); border: 2px solid rgba(0,0,0,.35); user-select: none; touch-action: none; }
  .chip.round { border-radius: 50%; } .chip.sq { border-radius: 12px; }
  .chip.drag { cursor: grabbing; box-shadow: 0 8px 18px rgba(0,0,0,.35); z-index: 99; }
  body.ui0 #panel { display: none; } body.ui0 #stage { padding: 0; } body.ui0 #board { border-radius: 0; border: 0; }
</style>
</head>
<body>
<div id="panel">
  <label>頭数・艇数 <span id="nums"></span></label>
  <label>種類 <select id="mode"><option value="horse">競馬（枠色）</option><option value="boat">ボート（1〜6号艇）</option></select></label>
  <label>大きさ <input type="range" id="size" min="30" max="90" value="54"></label>
  <label><input type="checkbox" id="clear"> 背景なし（配信用）</label>
  <button id="reset">並べ直す</button>
  <button id="save">PNG保存</button>
</div>
<div id="stage"><div id="board"></div></div>
<script>
// 枠の色（競馬は 1〜8 枠、ボートは 1〜6 号艇）
const COL = [['#ffffff', '#111'], ['#1b1b1b', '#fff'], ['#e60012', '#fff'], ['#0068b7', '#fff'], ['#ffd400', '#111'], ['#009944', '#fff'], ['#f39800', '#111'], ['#f19ec2', '#111']];
const LANES = ['逃げ', '先行', '差し', '追込'];
const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
const store = (() => { try { return JSON.parse(localStorage.getItem('tenkai') || '{}'); } catch (e) { return {}; } })();
const S = { n: Math.min(18, Math.max(1, +(Q.get('n') || store.n || 8))), mode: Q.get('mode') || store.mode || 'horse', size: +(store.size || 54), pos: store.pos || {} };
if (Q.get('ui') === '0') document.body.classList.add('ui0');
if (Q.get('clear') === '1') document.body.classList.add('clear');
const save = () => { try { localStorage.setItem('tenkai', JSON.stringify({ n: S.n, mode: S.mode, size: S.size, pos: S.pos })); } catch (e) {} };

// 馬番 → 枠（JRA の決め方: 9頭以上は、外の枠から2頭ずつ。17・18頭は8枠・7枠が3頭）
function frameOf(num, n) {
  const c = Array(8).fill(1); let extra = n - 8; for (let f = 7; extra > 0; f = (f + 7) % 8) { c[f]++; extra--; }
  let acc = 0; for (let f = 0; f < 8; f++) { acc += c[f]; if (num <= acc) return f; } return 7;
}
const maxCount = () => (S.mode === 'boat' ? 6 : 18);
function colorOf(num) { return COL[S.mode === 'boat' ? Math.min(5, num - 1) : frameOf(num, S.n)]; }
function defaultPos(i, n) { const row = i % 4; return { x: 88 - 76 * (n > 1 ? i / (n - 1) : 0), y: ((row + 0.5) / 4) * 100 }; }

const board = $('board');
function buildBoard() {
  board.innerHTML = '';
  LANES.forEach((t, i) => { const d = document.createElement('div'); d.className = 'lane'; d.style.top = i * 25 + '%'; d.style.height = '25%'; d.innerHTML = '<span>' + t + '</span>'; board.appendChild(d); });
  const ar = document.createElement('div'); ar.className = 'arrow'; ar.textContent = '前 ▶'; board.appendChild(ar);
  for (let num = 1; num <= S.n; num++) {
    const [bg, fg] = colorOf(num), p = S.pos[num] || (S.pos[num] = defaultPos(num - 1, S.n));
    const c = document.createElement('div'); c.className = 'chip ' + (S.mode === 'boat' ? 'round' : 'sq'); c.textContent = num; c.dataset.n = num;
    c.style.background = bg; c.style.color = fg; c.style.left = p.x + '%'; c.style.top = p.y + '%';
    if (bg === '#ffffff') c.style.borderColor = 'rgba(0,0,0,.55)';
    board.appendChild(c);
  }
  board.style.setProperty('--sz', S.size + 'px');
}
function buildNums() {
  const box = $('nums'); box.innerHTML = '';
  for (let i = 1; i <= maxCount(); i++) { const b = document.createElement('button'); b.textContent = i; b.className = i === S.n ? 'sel' : ''; b.onclick = () => { S.n = i; save(); refresh(); }; box.appendChild(b); }
}
function refresh() { S.n = Math.min(S.n, maxCount()); $('mode').value = S.mode; $('size').value = S.size; $('clear').checked = document.body.classList.contains('clear'); buildNums(); buildBoard(); }

// ドラッグで動かす
let drag = null;
board.addEventListener('pointerdown', (e) => { const c = e.target.closest('.chip'); if (!c) return; const r = board.getBoundingClientRect(); const rc = c.getBoundingClientRect(); drag = { c, dx: e.clientX - (rc.left + rc.width / 2), dy: e.clientY - (rc.top + rc.height / 2), r }; c.classList.add('drag'); c.setPointerCapture(e.pointerId); });
board.addEventListener('pointermove', (e) => { if (!drag) return; const r = drag.r, x = Math.min(100, Math.max(0, ((e.clientX - drag.dx - r.left) / r.width) * 100)), y = Math.min(100, Math.max(0, ((e.clientY - drag.dy - r.top) / r.height) * 100)); drag.c.style.left = x + '%'; drag.c.style.top = y + '%'; S.pos[drag.c.dataset.n] = { x, y }; });
const endDrag = () => { if (drag) { drag.c.classList.remove('drag'); drag = null; save(); } };
board.addEventListener('pointerup', endDrag); board.addEventListener('pointercancel', endDrag);

$('mode').onchange = (e) => { S.mode = e.target.value; S.n = Math.min(S.n, maxCount()); save(); refresh(); };
$('size').oninput = (e) => { S.size = +e.target.value; board.style.setProperty('--sz', S.size + 'px'); save(); };
$('clear').onchange = (e) => document.body.classList.toggle('clear', e.target.checked);
$('reset').onclick = () => { S.pos = {}; save(); refresh(); };
$('save').onclick = () => {
  const r = board.getBoundingClientRect(), W = Math.round(r.width * 2), H = Math.round(r.height * 2), k = 2, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  const clear = document.body.classList.contains('clear');
  if (!clear) { g.fillStyle = '#f7f9fb'; g.fillRect(0, 0, W, H); g.strokeStyle = '#c9d3dc'; g.setLineDash([8, 8]); g.lineWidth = 2; g.font = 'bold 28px sans-serif'; g.fillStyle = '#7b8c9a'; for (let i = 0; i < 4; i++) { if (i) { g.beginPath(); g.moveTo(0, (H / 4) * i); g.lineTo(W, (H / 4) * i); g.stroke(); } g.fillText(LANES[i], 24, (H / 4) * i + 42); } g.setLineDash([]); g.font = '26px sans-serif'; g.textAlign = 'right'; g.fillText('前 ▶', W - 28, H - 18); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let num = 1; num <= S.n; num++) {
    const [bg, fg] = colorOf(num), p = S.pos[num], cx = (p.x / 100) * W, cy = (p.y / 100) * H, s = S.size * k;
    g.save(); g.shadowColor = 'rgba(0,0,0,.3)'; g.shadowBlur = 10; g.shadowOffsetY = 3; g.fillStyle = bg; g.beginPath();
    if (S.mode === 'boat') g.arc(cx, cy, s / 2, 0, Math.PI * 2); else g.roundRect(cx - s / 2, cy - s / 2, s, s, 24);
    g.fill(); g.restore(); g.lineWidth = 4; g.strokeStyle = bg === '#ffffff' ? 'rgba(0,0,0,.55)' : 'rgba(0,0,0,.35)'; g.stroke();
    g.fillStyle = fg; g.font = '800 ' + s * 0.5 + 'px sans-serif'; g.fillText(String(num), cx, cy + s * 0.03);
  }
  const a = document.createElement('a'); a.download = 'tenkai.png'; a.href = cv.toDataURL('image/png'); a.click();
};
refresh();
</script>
</body>
</html>
