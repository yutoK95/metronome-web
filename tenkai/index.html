<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展開予想ボード（競馬・ボート・競輪）</title>
<style>
  :root { --ink: #22303c; --paper: #f7f9fb; --line: #c9d3dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e9eef2; color: var(--ink); font-family: system-ui, "Yu Gothic UI", Meiryo, sans-serif; }
  body { display: flex; flex-direction: column; }
  #panel { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); font-size: 14px; user-select: none; }
  #panel label { display: inline-flex; align-items: center; gap: 6px; }
  #panel button, #panel select { font: inherit; color: var(--ink); background: #f1f5f8; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #panel button:hover { background: #e4ecf2; }
  #panel select:disabled { opacity: .45; cursor: default; }
  #nums { display: flex; flex-wrap: wrap; gap: 4px; max-width: 560px; }
  #nums button { width: 30px; padding: 4px 0; text-align: center; }
  #nums button.sel { background: #22303c; color: #fff; border-color: #22303c; }
  #stage { flex: 1; min-height: 0; padding: 14px; display: flex; align-items: center; justify-content: center; }
  #board { container-type: size; position: relative; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; touch-action: none; flex: 1; align-self: stretch; }
  #board.course { flex: none; align-self: auto; background: #fbfcfd; }
  body.clear #board { background: transparent; border-color: transparent; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lane { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .lane:first-of-type { border-top: 0; }
  .lane span { position: absolute; left: 12px; top: 8px; font-size: 14px; font-weight: 700; color: #7b8c9a; letter-spacing: .1em; }
  .arrow { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: #7b8c9a; }
  body.clear .lane, body.clear .arrow, body.clear #bg { display: none; }
  .chip { --d: calc(var(--sz, 70) * 100cqw / 1600); position: absolute; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); display: grid; place-items: center; font-weight: 800; font-size: calc(var(--d) * 0.5); cursor: grab; box-shadow: 0 2px 6px rgba(0,0,0,.28); border: max(1px, calc(var(--d) * 0.04)) solid rgba(0,0,0,.35); user-select: none; touch-action: none; }
  .chip.round { border-radius: 50%; } .chip.sq { border-radius: 12px; }
  .chip.drag { cursor: grabbing; box-shadow: 0 8px 18px rgba(0,0,0,.35); z-index: 99; }
  body.ui0 #panel { display: none; } body.ui0 #stage { padding: 0; } body.ui0 #board { border-radius: 0; border: 0; }
</style>
</head>
<body>
<div id="panel">
  <label>種類 <select id="mode"></select></label>
  <label>表示 <select id="view"><option value="course">コース図</option><option value="lane">脚質ボード</option></select></label>
  <label>コース <select id="course"></select></label>
  <label>距離 <select id="dist"></select></label>
  <label>頭数・艇数・車数 <span id="nums"></span></label>
  <label>大きさ <input type="range" id="size" min="40" max="150" value="70"></label>
  <label hidden><input type="checkbox" id="detail"> 詳細（直線の距離）</label>   <!-- 出す要素を選べるようにするまで、いったん非表示。?detail=1 では表示できる -->
  <label><input type="checkbox" id="clear"> 背景なし（配信用）</label>
  <button id="reset">並べ直す</button>
  <button id="save">PNG保存</button>
</div>
<div id="stage"><div id="board"></div></div>
<script>
// 枠・車番の色
const COL = [['#ffffff', '#111'], ['#1b1b1b', '#fff'], ['#e60012', '#fff'], ['#0068b7', '#fff'], ['#ffd400', '#111'], ['#009944', '#fff'], ['#f39800', '#111'], ['#f19ec2', '#111'], ['#7b3fa0', '#fff']];
// 馬番 → 枠（9頭以上は外の枠から2頭ずつ、17・18頭は外の枠が3頭）
function frameOf(num, n) { const c = Array(8).fill(1); let extra = n - 8; for (let f = 7; extra > 0; f = (f + 7) % 8) { c[f]++; extra--; } let acc = 0; for (let f = 0; f < 8; f++) { acc += c[f]; if (num <= acc) return f; } return 7; }
const horseColor = (num, n) => COL[frameOf(num, n)], seqColor = (num) => COL[Math.min(COL.length - 1, num - 1)];

// JRA の競馬場: [場名, 回り(右=true), [[名前, 面, ゴール前の直線(m), 形のキー, 1周(m), 距離の一覧], ...]]。数値は参考値（公式資料で要確認）
const JRA_VENUES = [
  ['札幌', true, [['芝', 't', 266.1, 0, 1641, [1000, 1200, 1500, 1800, 2000, 2600]], ['ダート', 'd', 264.3, 0, 1487, [1000, 1700, 2400]]]],
  ['函館', true, [['芝', 't', 262.1, 0, 1627, [1000, 1200, 1800, 2000, 2600]], ['ダート', 'd', 260.3, 0, 1475, [1000, 1700, 2400]]]],
  ['福島', true, [['芝', 't', 292.0, 0, 1600, [1200, 1700, 1800, 2000, 2600]], ['ダート', 'd', 295.7, 0, 1445, [1150, 1700, 2400]]]],
  ['新潟', false, [['芝・外回り', 't', 658.7, 'outer', 2223, [1400, 1600, 1800, 2000, 2200]], ['芝・内回り', 't', 358.7, 'inner', 1623, [1200, 2000, 2200, 2400]], ['ダート', 'd', 353.9, 'inner', 1472, [1200, 1800, 2500]], ['芝・直線1000m', 's', 1000]]],
  ['東京', false, [['芝', 't', 525.9, 0, 2084, [1400, 1600, 1800, 2000, 2300, 2400, 2500, 3400]], ['ダート', 'd', 501.6, 0, 1899, [1300, 1400, 1600, 2100, 2400]]]],
  ['中山', true, [['芝・外回り', 't', 310.0, 'outer', 1840, [1200, 1600, 2200]], ['芝・内回り', 't', 310.0, 'inner', 1667, [1800, 2000, 2500, 3600]], ['ダート', 'd', 308.0, 'inner', 1493, [1200, 1800, 2400, 2500]]]],
  ['中京', false, [['芝', 't', 412.5, 0, 1706, [1200, 1400, 1600, 2000, 2200, 3000]], ['ダート', 'd', 410.7, 0, 1530, [1200, 1400, 1800, 1900]]]],
  ['京都', true, [['芝・外回り', 't', 403.7, 'outer', 1894, [1400, 1600, 1800, 2200, 2400, 3000, 3200]], ['芝・内回り', 't', 328.4, 'inner', 1783, [1200, 1400, 1600, 2000]], ['ダート', 'd', 329.1, 'inner', 1608, [1200, 1400, 1800, 1900]]]],
  ['阪神', true, [['芝・外回り', 't', 473.6, 'outer', 2089, [1600, 1800, 2400, 2600]], ['芝・内回り', 't', 356.5, 'inner', 1689, [1200, 1400, 2000, 2200, 3000]], ['ダート', 'd', 352.5, 'inner', 1518, [1200, 1400, 1800, 2000]]]],
  ['小倉', true, [['芝', 't', 293.0, 0, 1615, [1200, 1700, 1800, 2000, 2600]], ['ダート', 'd', 291.3, 0, 1445, [1000, 1700, 2400]]]],
];
// 地方競馬: [場名, 右回り, [[名前, 面, ゴール前の直線(m)]]]（参考値）
const NAR_VENUES = [
  ['門別', true, [['ダート', 'd', 330, 0, 1375, [1000, 1100, 1200, 1500, 1600, 1700, 1800, 2000]]]], ['盛岡', false, [['ダート', 'd', 300, 0, 1600, [1200, 1400, 1600, 1800, 2000]]]], ['水沢', true, [['ダート', 'd', 245, 0, 1200, [850, 1300, 1400, 1600, 1800]]]],
  ['浦和', false, [['ダート', 'd', 220, 0, 1200, [800, 1300, 1400, 1500, 1600, 1900, 2000]]]], ['船橋', false, [['ダート', 'd', 308, 0, 1400, [1000, 1200, 1500, 1600, 1700, 1800, 2200]]]], ['大井', true, [['ダート', 'd', 386, 0, 1600, [1000, 1200, 1400, 1500, 1600, 1700, 1800, 2000, 2400]]]], ['川崎', false, [['ダート', 'd', 300, 0, 1200, [900, 1400, 1500, 1600, 2000, 2100]]]],
  ['金沢', true, [['ダート', 'd', 236, 0, 1200, [900, 1300, 1400, 1500, 1700, 1900, 2000]]]], ['笠松', true, [['ダート', 'd', 238, 0, 1100, [800, 1400, 1600, 1800, 1900]]]], ['名古屋', true, [['ダート', 'd', 240, 0, 1180, [920, 1500, 1700, 2000]]]],
  ['園田', true, [['ダート', 'd', 213, 0, 1051, [820, 1230, 1400, 1700, 1870]]]], ['姫路', true, [['ダート', 'd', 230, 0, 1200, [800, 1400, 1500, 1800, 2000]]]], ['高知', true, [['ダート', 'd', 200, 0, 1100, [1300, 1400, 1600, 1900]]]], ['佐賀', true, [['ダート', 'd', 200, 0, 1100, [900, 1300, 1400, 1750, 1800, 2000]]]],
  ['帯広', true, [['ばんえい直線', 's', 200]]],
];
const JRA_BAND = { t: '#bfe3b0', d: '#e6d3ab' };
// 競馬場の形: コースの中心線（左回りで描き、右回りは左右を反転）。「M x0 y H x1」で始めて、ホームストレッチを左から右へ。home = [x0, x1, y]
const ovalPath = (a, r) => `M ${800 - a} ${450 + r} H ${800 + a} A ${r} ${r} 0 0 0 ${800 + a} ${450 - r} H ${800 - a} A ${r} ${r} 0 0 0 ${800 - a} ${450 + r} Z`;
const VENUE_SHAPES = {   // 特徴をとらえた模式図（実寸ではない）
  '東京': { turf: { d: 'M 300 700 H 1150 C 1480 700 1480 200 1100 200 L 500 200 C 230 200 180 700 300 700 Z', home: [300, 1150, 700] } },
  '中京': { turf: { d: 'M 350 700 H 1100 C 1360 700 1360 300 1100 300 L 520 300 C 250 300 240 700 350 700 Z', home: [350, 1100, 700] } },
  '札幌': { turf: { d: ovalPath(240, 250), home: [560, 1040, 700] } },
  // 中山: 外回りは1〜2コーナーで大きく外へふくらみ、向正面が短く、3〜4コーナーは内回りと共通
  '中山': { outer: { d: 'M 420 700 H 980 C 1400 700 1480 170 1000 160 C 760 155 560 250 440 350 C 240 520 250 700 420 700 Z', home: [420, 980, 700] },
            inner: { d: 'M 420 700 H 980 C 1200 700 1200 380 980 380 L 520 380 C 480 380 460 370 440 350 C 240 520 250 700 420 700 Z', home: [420, 980, 700] } },
  // 京都: 外回りは3コーナー（坂）で外へ大きくふくらむ
  '京都': { outer: { d: 'M 400 700 H 1100 C 1330 700 1330 320 1100 320 L 650 320 C 350 320 120 420 160 600 C 190 700 300 700 400 700 Z', home: [400, 1100, 700] },
            inner: { d: 'M 400 700 H 1100 C 1330 700 1330 320 1100 320 L 650 320 C 420 320 300 420 300 560 C 300 680 350 700 400 700 Z', home: [400, 1100, 700] } },
  // 阪神: 外回りは2コーナーから向正面が外へ大きくふくらみ、4コーナーで合流
  '阪神': { outer: { d: 'M 400 700 H 1100 C 1330 700 1380 300 1150 230 C 900 150 600 160 450 230 C 200 330 250 700 400 700 Z', home: [400, 1100, 700] },
            inner: { d: 'M 400 700 H 1100 C 1300 700 1300 380 1100 380 L 520 380 C 250 380 250 700 400 700 Z', home: [400, 1100, 700] } },
  // 新潟: 外回りは3コーナーから外へ出て、長い直線へ
  '新潟': { outer: { d: 'M 160 700 H 1200 C 1420 700 1420 360 1200 360 L 700 360 C 420 360 60 400 60 560 C 60 680 110 700 160 700 Z', home: [160, 1200, 700] },
            inner: { d: 'M 480 700 H 1200 C 1420 700 1420 360 1200 360 L 700 360 C 520 360 330 420 330 540 C 330 660 400 700 480 700 Z', home: [480, 1200, 700] } },
};
const PATH_CACHE = {};
function pathInfo(d) {   // 中心線の長さ・中心・上下の範囲（既定の並べ方と、ダートの縮小に使う）
  if (PATH_CACHE[d]) return PATH_CACHE[d];
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'path'); el.setAttribute('d', d); const L = el.getTotalLength();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (let i = 0; i < 120; i++) { const p = el.getPointAtLength(L * i / 120); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  return (PATH_CACHE[d] = { el, L, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, y0, y1 });
}
const DIRT_K = 0.78, W_TURF = 100, W_DIRT = 80;
function jraCourses(venues = JRA_VENUES, gl = 'JRA') {
  const gen = (D) => { const a = Math.max(150, Math.round(0.7 * D)), r = 190; return { turf: { d: ovalPath(a, r), home: [800 - a, 800 + a, 450 + r] } }; };
  const gb = gl === 'JRA' ? JRA_BAND.t : JRA_BAND.d;
  const o = { l: { name: '左回り（汎用）', kind: 'track', cw: false, shapes: gen(380 / 0.7), ref: 'turf', k: 1, w: W_TURF, band: gb, onlyDirt: gl !== 'JRA', label: gl }, r: { name: '右回り（汎用）', kind: 'track', cw: true, shapes: gen(380 / 0.7), ref: 'turf', k: 1, w: W_TURF, band: gb, onlyDirt: gl !== 'JRA', label: gl } };
  for (const [v, cw, list] of venues) {
    const shapes = VENUE_SHAPES[v] || gen(list[0][2]), dirt = list.find((e) => e[1] === 'd'), dirtRef = dirt ? (dirt[3] || 'turf') : null, onlyDirt = list.every((e) => e[1] !== 't');
    list.forEach(([nm, surf, D, ref, lap, dists], i) => {
      const key = v + i, name = v + ' ' + nm + '（' + (cw ? '右' : '左') + (surf === 's' ? '' : '回り') + '・直線' + (D % 1 ? D.toFixed(1) : D) + 'm）';
      if (surf === 's') { o[key] = { name: v + ' ' + nm, kind: 'straight', band: gl !== 'JRA' ? JRA_BAND.d : JRA_BAND.t, D, grp: v, label: v + ' ' + nm }; return; }
      const isD = surf === 'd' && !onlyDirt;
      o[key] = { name, kind: 'track', cw, shapes, lap: lap || 0, dists: dists || [], ref: ref || 'turf', k: isD ? DIRT_K : 1, w: isD ? W_DIRT : W_TURF, band: JRA_BAND[surf], dirtRef: onlyDirt ? null : dirtRef, onlyDirt, D, grp: v, label: v + ' ' + nm };
    });
  }
  return o;
}
// 種類とコース形態
const MODES = {
  jra: { name: '競馬（JRA）', max: 18, shape: 'sq', color: horseColor, lanes: ['逃げ', '先行', '差し', '追込'], band: '#bfe3b0', courses: jraCourses() },
  nar: { name: '競馬（地方）', max: 16, shape: 'sq', color: horseColor, lanes: ['逃げ', '先行', '差し', '追込'], band: '#e6d3ab', courses: jraCourses(NAR_VENUES, '地方競馬') },
  boat: { name: 'ボート（競艇）', max: 6, shape: 'round', color: (n) => seqColor(n), lanes: ['1コース', '2コース', '3コース', '4コース', '5コース', '6コース'], courses: { all: { name: '水面全体（左回り）', kind: 'pond' }, m1: { name: 'スタート〜1マーク', kind: 'm1' } } },
  keirin: { name: '競輪', max: 9, shape: 'round', color: (n) => seqColor(n), lanes: ['先行', '捲り', '追込', '自在'], band: '#efc796', courses: { b400: { name: '400バンク', kind: 'oval', cw: false, a: 330, r: 190, w: 150, bank: true }, b333: { name: '333バンク', kind: 'oval', cw: false, a: 250, r: 215, w: 150, bank: true }, b500: { name: '500バンク', kind: 'oval', cw: false, a: 430, r: 170, w: 150, bank: true } } },
};
const VIEWS = { course: 1, lane: 1 };
const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
const store = (() => { try { return JSON.parse(localStorage.getItem('tenkai2') || '{}'); } catch (e) { return {}; } })();
let modeQ = Q.get('mode') || store.mode || 'jra'; if (modeQ === 'horse') modeQ = 'jra'; if (!MODES[modeQ]) modeQ = 'jra';
const S = { mode: modeQ, view: VIEWS[Q.get('view')] ? Q.get('view') : (store.view || 'course'), course: Q.get('course') || store.course, dist: store.dist || {}, n: +(Q.get('n') || store.n || 8), detail: Q.get('detail') === '1', size: store.size >= 40 && store.size <= 150 && store.v === 2 ? +store.size : 70, pos: store.pos || {} };
if (Q.get('ui') === '0') document.body.classList.add('ui0');
if (Q.get('clear') === '1') document.body.classList.add('clear');
const save = () => { try { localStorage.setItem('tenkai2', JSON.stringify({ v: 2, detail: S.detail, dist: S.dist, mode: S.mode, view: S.view, course: S.course, n: S.n, size: S.size, pos: S.pos })); } catch (e) {} };
const M = () => MODES[S.mode], C = () => M().courses[S.course];
const distOf = () => { const c = C(); if (!c || !c.dists || !c.dists.length) return 0; const d = +(S.dist[S.mode + '|' + S.course] || 0); return c.dists.includes(d) ? d : 0; };   // 選んだ距離（コースごとに覚える。0 は指定なし）
const colorOf = (num) => (S.mode === 'jra' || S.mode === 'nar' ? horseColor(num, S.n) : seqColor(num));

if (Q.get('dist')) { S.dist[S.mode + '|' + (M().courses[S.course] ? S.course : Object.keys(M().courses)[0])] = +Q.get('dist'); }
function normalize() { if (!MODES[S.mode]) S.mode = 'jra'; if (!M().courses[S.course]) S.course = Object.keys(M().courses)[0]; S.n = Math.max(1, Math.min(M().max, S.n)); }

// ---- 周回コース上の位置（1600x900 の座標。反時計回りで作って、右回りは左右を反転）
function ovalPoint(c, s, ro) {
  const a = c.a, r0 = c.r + ro, L = 4 * a + 2 * Math.PI * r0; s = ((s % L) + L) % L; let x, y;
  if (s < 2 * a) { x = 800 - a + s; y = 450 + r0; }
  else if (s < 2 * a + Math.PI * r0) { const t = (s - 2 * a) / r0; x = 800 + a + r0 * Math.sin(t); y = 450 + r0 * Math.cos(t); }
  else if (s < 4 * a + Math.PI * r0) { x = 800 + a - (s - 2 * a - Math.PI * r0); y = 450 - r0; }
  else { const t = (s - 4 * a - Math.PI * r0) / r0; x = 800 - a - r0 * Math.sin(t); y = 450 - r0 * Math.cos(t); }
  return { x: c.cw ? 1600 - x : x, y };
}
const stadium = (a, R) => `M ${800 - a} ${450 + R} H ${800 + a} A ${R} ${R} 0 0 0 ${800 + a} ${450 - R} H ${800 - a} A ${R} ${R} 0 0 0 ${800 - a} ${450 + R} Z`;
const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.s || 30}" font-weight="700" fill="${o.f || '#6d7f8d'}" text-anchor="${o.a || 'middle'}" font-family="sans-serif">${t}</text>`;

function courseSVG() {
  const c = C(), m = M();
  if (c.kind === 'track') {
    const mir = (x) => (c.cw ? 1600 - x : x), tf = c.cw ? 'translate(1600 0) scale(-1 1)' : '', keys = Object.keys(c.shapes), outer = c.shapes[keys[0]], oi = pathInfo(outer.d);
    const sc = (k, info) => (k < 1 ? `transform="translate(${info.cx} ${info.cy}) scale(${k}) translate(${-info.cx} ${-info.cy})"` : '');
    // 帯（コース）: 選んでいないものは薄く、選んだものを最後に描く
    const bands = keys.map((k) => ({ d: c.shapes[k].d, w: W_TURF, k: 1, col: c.onlyDirt ? JRA_BAND.d : JRA_BAND.t, sel: c.k === 1 && c.ref === k }));
    if (c.dirtRef) bands.push({ d: c.shapes[c.dirtRef].d, w: W_DIRT, k: DIRT_K, col: JRA_BAND.d, sel: c.k < 1 });
    bands.sort((a, b) => a.sel - b.sel);
    let s = `<g transform="${tf}"><path d="${outer.d}" fill="#d9efcf" stroke="none"/>`;
    for (const b of bands) { const info = pathInfo(b.d), t = sc(b.k, info); s += b.sel
      ? `<path d="${b.d}" fill="none" stroke="#111" stroke-width="${b.w + 10}" ${t}/><path d="${b.d}" fill="none" stroke="${b.col}" stroke-width="${b.w}" ${t}/>`   // 選んだコース: 黒い枠線
      : `<g opacity=".45"><path d="${b.d}" fill="none" stroke="#9aa8b3" stroke-width="${b.w + 6}" ${t}/><path d="${b.d}" fill="none" stroke="#e9eef0" stroke-width="${b.w}" ${t}/></g>`; }   // ほかのコース: 灰色で薄く
    // ゴール（選んだコースの、ホームストレッチの右寄り）
    const sh = c.shapes[c.ref], info = pathInfo(sh.d), k = c.k, gx = info.cx + (sh.home[1] - 90 - info.cx) * k, gy = info.cy + (sh.home[2] - info.cy) * k, x0 = info.cx + (sh.home[0] - info.cx) * k;
    // 距離が選ばれていたら、スタート地点と走る道のりを描く（1周の長さから、ゴールより手前へさかのぼる）
    const dist = distOf(), L = info.L, sg = sh.home[1] - 90 - sh.home[0]; let st = null;
    if (dist && c.lap) {
      const full = dist * L / c.lap, run = Math.min(L, full), s0 = (((sg - full) % L) + L) % L, t = sc(k, info);
      const dash = run >= L - 1 ? '' : (s0 < sg ? `stroke-dasharray="${run} ${L}" stroke-dashoffset="${-s0}"` : `stroke-dasharray="${sg} ${s0 - sg} ${L - s0}"`);
      s += `<path d="${sh.d}" fill="none" stroke="#ffb020" stroke-width="${c.w * 0.72}" opacity=".95" ${dash} ${t}/>`;   // 走る道のり: 橙色
      const p = info.el.getPointAtLength(s0), q = info.el.getPointAtLength((s0 + 2) % L), tx = q.x - p.x, ty = q.y - p.y, tl = Math.hypot(tx, ty) || 1, nx = -ty / tl, ny = tx / tl, hw = W_TURF / 2 + 4;

    if (det) s += `<g stroke="#d6336c" stroke-width="5"><line x1="${x0}" y1="${ly}" x2="${gx}" y2="${ly}"/><line x1="${x0}" y1="${ly - 14}" x2="${x0}" y2="${ly + 14}"/><line x1="${gx}" y1="${ly - 14}" x2="${gx}" y2="${ly + 14}"/></g>`;
    s += '</g>';
    if (st) s += T(st.x, st.y + 10, 'スタート ' + dist + 'm', { s: 32, f: '#111' });
    if (det) s += T(mir((x0 + gx) / 2), ly + 46, 'ゴール前の直線 ' + (c.D % 1 ? c.D.toFixed(1) : c.D) + 'm', { s: 32, f: '#d6336c' }) + T(mir(gx), ly + 86, 'ゴール', { s: 28 });

    const outer = stadium(c.a, c.r + c.w / 2), inner = stadium(c.a, c.r - c.w / 2), tf = c.cw ? 'translate(1600 0) scale(-1 1)' : '';

    if (det) { const ly = by + 36; s += `<g stroke="#d6336c" stroke-width="5"><line x1="${x0}" y1="${ly}" x2="${gx}" y2="${ly}"/><line x1="${x0}" y1="${ly - 14}" x2="${x0}" y2="${ly + 14}"/><line x1="${gx}" y1="${ly - 14}" x2="${gx}" y2="${ly + 14}"/></g>` + T((x0 + gx) / 2, ly + 46, 'ゴール前の直線 ' + (c.D % 1 ? c.D.toFixed(1) : c.D) + 'm', { s: 32, f: '#d6336c' }) + T(gx, ly + 86, 'ゴール', { s: 28 }); }

    s += T(800, ty - 22, c.cw ? '進行方向 →' : '← 進行方向', { s: 28 }) + T(800, 450 + 10, c.bank ? c.name : (c.label || (S.mode === 'jra' ? 'JRA' : '地方競馬')), { s: 40, f: '#9fb0bd' });

  }
  if (c.kind === 'straight') return (S.detail && c.D ? `<g stroke="#d6336c" stroke-width="5"><line x1="200" y1="710" x2="1400" y2="710"/><line x1="200" y1="696" x2="200" y2="724"/><line x1="1400" y1="696" x2="1400" y2="724"/></g>` + T(800, 764, 'スタート〜ゴール ' + c.D + 'm', { s: 32, f: '#d6336c' }) : '') + `<rect x="120" y="300" width="1360" height="300" rx="10" fill="${m.band}" stroke="#8fa0ad" stroke-width="5"/><line x1="1400" y1="300" x2="1400" y2="600" stroke="#222" stroke-width="7" stroke-dasharray="14 10"/><line x1="200" y1="300" x2="200" y2="600" stroke="#8fa0ad" stroke-width="4" stroke-dasharray="6 8"/>` + T(200, 270, 'スタート') + T(1400, 270, 'ゴール') + T(800, 270, '進行方向 →', { s: 28 }) + T(800, 660, 'スタンド', { s: 26, f: '#9aa8b3' });

  // スタート〜1マーク
  let s = `<rect x="80" y="100" width="1440" height="700" rx="90" fill="#cfe6f5" stroke="#8fa0ad" stroke-width="5"/><line x1="260" y1="170" x2="260" y2="780" stroke="#222" stroke-width="7" stroke-dasharray="14 10"/>` + T(260, 830, 'スタートライン', { s: 26 });

  return s + `<circle cx="1330" cy="170" r="22" fill="#f39800"/>` + T(1330, 130, '1マーク', { s: 26 }) + T(900, 840, '進行方向 →（左へ旋回）', { s: 26, f: '#9aa8b3' });
}

function defaultPos(num) {
  const n = S.n, i = num - 1, c = C();
  if (S.view === 'lane') { const rows = M().lanes.length, row = M().lanes.length === 6 ? i : i % rows; return { x: 88 - 76 * (n > 1 ? i / (n - 1) : 0), y: ((row + 0.5) / rows) * 100 }; }
  if (c.kind === 'oval') { const p = ovalPoint(c, 1.35 * c.a + 20 - Math.floor(i / 2) * 85, ((i % 2) - 0.5) * c.w * 0.7); return { x: p.x / 16, y: p.y / 9 }; }
  if (c.kind === 'track') {
    const sh = c.shapes[c.ref], info = pathInfo(sh.d), k = c.k, L = info.L, sg = sh.home[1] - 90 - sh.home[0];
    const dist = distOf(), run = dist && c.lap ? dist * L / c.lap : 0;
    let sp = run ? sg - (run % L) + 40 / k + Math.floor(i / 2) * 85 / k : sg - 10 - Math.floor(i / 2) * 85 / k; sp = ((sp % L) + L) % L;
    const p = info.el.getPointAtLength(sp), q = info.el.getPointAtLength((sp + 2) % L), tx = q.x - p.x, ty = q.y - p.y, tl = Math.hypot(tx, ty) || 1, ro = ((i % 2) - 0.5) * W_TURF * 0.7;
    let x = p.x - ty / tl * ro, y = p.y + tx / tl * ro; x = info.cx + (x - info.cx) * k; y = info.cy + (y - info.cy) * k; if (c.cw) x = 1600 - x;

  if (c.kind === 'straight') return { x: (170 + Math.floor(i / 3) * 100) / 16, y: (365 + (i % 3) * 85) / 9 };
  if (c.kind === 'm1') return { x: (i % 2 ? 17 : 21), y: (240 + i * 96) / 9 };

const board = $('board');
const posKey = () => S.mode + '|' + S.view + '|' + (S.view === 'course' ? S.course + '|' + distOf() : '-') + '|' + S.n;

  else { const L = M().lanes; L.forEach((t, i) => { const d = document.createElement('div'); d.className = 'lane'; d.style.top = (i * 100 / L.length) + '%'; d.style.height = (100 / L.length) + '%'; d.innerHTML = '<span>' + t + '</span>'; board.appendChild(d); }); const ar = document.createElement('div'); ar.className = 'arrow'; ar.textContent = '前 ▶'; board.appendChild(ar); }

    c.className = 'chip ' + M().shape; c.textContent = num; c.dataset.n = num; c.style.background = bg; c.style.color = fg; c.style.left = p.x + '%'; c.style.top = p.y + '%';

}
function fit() {

  if (S.view === 'course') { const w = Math.max(200, Math.min(aw, ah * 16 / 9)); board.style.width = w + 'px'; board.style.height = (w * 9 / 16) + 'px'; } else { board.style.width = ''; board.style.height = ''; }
}
addEventListener('resize', fit);
function buildNums() { const box = $('nums'); box.innerHTML = ''; for (let i = 1; i <= M().max; i++) { const b = document.createElement('button'); b.textContent = i; b.className = i === S.n ? 'sel' : ''; b.onclick = () => { S.n = i; save(); refresh(); }; box.appendChild(b); } }

  $('size').value = S.size; $('detail').checked = !!S.detail; $('clear').checked = document.body.classList.contains('clear');
  buildNums(); buildBoard();
}

// ドラッグで動かす
let drag = null;
board.addEventListener('pointerdown', (e) => { const c = e.target.closest('.chip'); if (!c) return; const r = board.getBoundingClientRect(), rc = c.getBoundingClientRect(); drag = { c, dx: e.clientX - (rc.left + rc.width / 2), dy: e.clientY - (rc.top + rc.height / 2), r }; c.classList.add('drag'); c.setPointerCapture(e.pointerId); });
board.addEventListener('pointermove', (e) => { if (!drag) return; const r = drag.r, x = Math.min(100, Math.max(0, ((e.clientX - drag.dx - r.left) / r.width) * 100)), y = Math.min(100, Math.max(0, ((e.clientY - drag.dy - r.top) / r.height) * 100)); drag.c.style.left = x + '%'; drag.c.style.top = y + '%'; S.pos[posKey()][drag.c.dataset.n] = { x, y }; });
const endDrag = () => { if (drag) { drag.c.classList.remove('drag'); drag = null; save(); } };
board.addEventListener('pointerup', endDrag); board.addEventListener('pointercancel', endDrag);

$('mode').onchange = (e) => { S.mode = e.target.value; S.course = Object.keys(M().courses)[0]; save(); refresh(); };
$('view').onchange = (e) => { S.view = e.target.value; save(); refresh(); };
$('course').onchange = (e) => { S.course = e.target.value; save(); refresh(); };

// PNG 保存
$('save').onclick = async () => {

  if (!course && !clear) { const L = M().lanes; g.fillStyle = '#f7f9fb'; g.fillRect(0, 0, W, H); g.strokeStyle = '#c9d3dc'; g.setLineDash([8, 8]); g.lineWidth = 2; g.font = 'bold 28px sans-serif'; g.fillStyle = '#7b8c9a'; g.textAlign = 'left'; for (let i = 0; i < L.length; i++) { if (i) { g.beginPath(); g.moveTo(0, (H / L.length) * i); g.lineTo(W, (H / L.length) * i); g.stroke(); } g.fillText(L[i], 24, (H / L.length) * i + 42); } g.setLineDash([]); g.font = '26px sans-serif'; g.textAlign = 'right'; g.fillText('前 ▶', W - 28, H - 18); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let num = 1; num <= S.n; num++) {
    const [bg, fg] = colorOf(num), p = posOf(num), cx = (p.x / 100) * W, cy = (p.y / 100) * H, s = S.size * (W / 1600);
    g.save(); g.shadowColor = 'rgba(0,0,0,.3)'; g.shadowBlur = 10; g.shadowOffsetY = 3; g.fillStyle = bg; g.beginPath();
    if (M().shape === 'round') g.arc(cx, cy, s / 2, 0, Math.PI * 2); else g.roundRect(cx - s / 2, cy - s / 2, s, s, s * 0.22);

};
